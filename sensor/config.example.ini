[bme280]
# Direccion I2C del sensor: 0x76 (SDO a GND) o 0x77 (SDO a VCC)
i2c_address = 0x76
# Bus I2C (generalmente 1 en RPi)
i2c_bus = 1
# Intervalo de lectura en segundos
interval_seconds = 30
# Altitud del observatorio en metros (para corregir presion a nivel del mar)
altitude_m = 700

[mqtt]
host = 192.168.69.15
port = 1883
username = mqttuser
password = CHANGE_ME
# Topic raiz: homeassistant/observatory -> /temperature, /humidity, /pressure
# Patron consistente con sensores de sotano: homeassistant/basement/...
topic_prefix = homeassistant/observatory
# QoS: 0 = at most once, 1 = at least once, 2 = exactly once
qos = 1
retain = true

[ascom]
# Puerto para el servidor ASCOM Alpaca HTTP
port = 11111
# Nombre que expone el driver
device_name = Observatory BME280
device_number = 0
