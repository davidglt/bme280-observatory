[bme280]
# I2C address of the sensor: 0x76 (SDO to GND) or 0x77 (SDO to VCC)
i2c_address = 0x76
# I2C bus (not used by i2cpy/CH341T_V3; kept for documentation)
i2c_bus = 1
# Publishing interval in seconds
interval_seconds = 30
# Observatory altitude in metres (for sea-level pressure reduction)
altitude_m = 700

[mqtt]
host = 192.168.69.15
port = 1883
username = mqttuser
password = CHANGE_ME
# Root topic prefix: homeassistant/nyx; publishes individual measurement
# topics plus /pressure_altitude and one atomic /reading JSON sample.
topic_prefix = homeassistant/nyx
# QoS: 0 = at most once, 1 = at least once, 2 = exactly once
qos = 1
retain = true

[sharpcap]
# HTTP port for SharpCap and other local-network consumers
http_port = 5380

[ascom]
# Port for the ASCOM Alpaca HTTP server
port = 11111
# Device name exposed by the driver
device_name = NYX BME280
device_number = 0
