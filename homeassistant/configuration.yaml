# Fragmento de configuration.yaml para integrar el BME280 del observatorio via MQTT
# Pega este bloque en tu configuration.yaml de Home Assistant
# o incluye el archivo sensor.yaml con: mqtt: !include sensor.yaml
#
# Topics publicados por sensor/bme280_ch341t_v3.py:
#   homeassistant/observatory/temperature
#   homeassistant/observatory/humidity
#   homeassistant/observatory/pressure
#
# Patron consistente con sensores de sotano: homeassistant/basement/...

mqtt:
  sensor:
    - name: observatory_temperature
      unique_id: "observatory_temperature"
      state_class: measurement
      state_topic: "homeassistant/observatory/temperature"
      device_class: temperature
      unit_of_measurement: "\xb0C"

    - name: observatory_humidity
      unique_id: "observatory_humidity"
      state_class: measurement
      state_topic: "homeassistant/observatory/humidity"
      device_class: humidity
      unit_of_measurement: "%"

    - name: observatory_pressure
      unique_id: "observatory_pressure"
      state_class: measurement
      state_topic: "homeassistant/observatory/pressure"
      device_class: pressure
      unit_of_measurement: "hPa"
