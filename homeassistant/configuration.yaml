# Excerpt for configuration.yaml — integrates the NYX BME280 sensor via MQTT.
# Paste this block into your Home Assistant configuration.yaml,
# or include sensor.yaml with: mqtt: !include sensor.yaml
#
# Topics published by sensor/bme280_ch341t_v3.py:
#   homeassistant/nyx/temperature
#   homeassistant/nyx/humidity
#   homeassistant/nyx/pressure
#   homeassistant/nyx/pressure_altitude  (ISA, varies with weather)

mqtt:
  sensor:
    - name: NYX Temperature
      unique_id: "nyx_temperature"
      state_class: measurement
      state_topic: "homeassistant/nyx/temperature"
      device_class: temperature
      unit_of_measurement: "°C"

    - name: NYX Humidity
      unique_id: "nyx_humidity"
      state_class: measurement
      state_topic: "homeassistant/nyx/humidity"
      device_class: humidity
      unit_of_measurement: "%"

    - name: NYX Pressure
      unique_id: "nyx_pressure"
      state_class: measurement
      state_topic: "homeassistant/nyx/pressure"
      device_class: pressure
      unit_of_measurement: "hPa"

    - name: NYX Pressure Altitude
      unique_id: "nyx_pressure_altitude"
      state_class: measurement
      state_topic: "homeassistant/nyx/pressure_altitude"
      icon: mdi:altimeter
      unit_of_measurement: "m"
