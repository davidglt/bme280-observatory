# Configuration fragment for persisting observatory sensors in InfluxDB 2.x.
# Reference: https://www.home-assistant.io/integrations/influxdb/
#
# Add to configuration.yaml:
#   influxdb: !include influxdb.yaml

api_version: 2
host: localhost
port: 8086
token: !secret influxdb_token
organization: my_organization
bucket: observatory

include:
  entity_globs:
    - sensor.nyx_*

default_measurement: sensor

tags:
  location: observatory
  sensor: bme280
