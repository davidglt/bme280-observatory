# Example observatory alerts using the NYX BME280 entities.
- alias: "Observatory: high humidity alert"
  id: observatory_high_humidity_alert
  trigger:
    - platform: numeric_state
      entity_id: sensor.nyx_humidity
      above: 85
      for:
        minutes: 5
  action:
    - service: notify.mobile_app
      data:
        title: "Observatory - High humidity"
        message: >-
          Humidity is {{ states('sensor.nyx_humidity') }}%.
          Consider closing the observatory.

- alias: "Observatory: condensation risk"
  id: observatory_dew_risk
  trigger:
    - platform: template
      value_template: >-
        {% set temperature = states('sensor.nyx_temperature') %}
        {% set humidity = states('sensor.nyx_humidity') %}
        {% if is_number(temperature) and is_number(humidity) %}
          {% set t = temperature | float %}
          {% set rh = humidity | float %}
          {% if -80 < t < 85 and 0 < rh <= 100 %}
            {% set a = 17.625 %}
            {% set b = 243.04 %}
            {% set alpha = log(rh / 100) + a * t / (b + t) %}
            {{ (t - b * alpha / (a - alpha)) < 3 }}
          {% else %}
            false
          {% endif %}
        {% else %}
          false
        {% endif %}
      for:
        minutes: 3
  action:
    - service: notify.mobile_app
      data:
        title: "Observatory - Condensation risk"
        message: "Temperature is approaching the dew point. Check the observatory."
