# Home Assistant MQTT sensor configuration
# Patron de topics: homeassistant/<location>/<measurement>
# Consistente con los sensores del sotano (homeassistant/basement/...)
# Anadir bajo mqtt: en configuration.yaml, o incluir via !include

mqtt:
  sensor:
    - name: observatory_temperature
      unique_id: "observatory_temperature"
      state_class: measurement
      state_topic: "homeassistant/observatory/temperature"
      device_class: temperature
      unit_of_measurement: "\xb0C"

    - name: observatory_humidity
      unique_id: "observatory_humidity"
      state_class: measurement
      state_topic: "homeassistant/observatory/humidity"
      device_class: humidity
      unit_of_measurement: "%"

    - name: observatory_pressure
      unique_id: "observatory_pressure"
      state_class: measurement
      state_topic: "homeassistant/observatory/pressure"
      device_class: pressure
      unit_of_measurement: "hPa"
