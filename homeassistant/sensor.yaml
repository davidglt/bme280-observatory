# Home Assistant MQTT sensor configuration
# Add under mqtt: in configuration.yaml, or include via !include

mqtt:
  sensor:
    - name: "Observatory Temperature"
      unique_id: observatory_bme280_temperature
      state_topic: "observatory/bme280/temperature"
      unit_of_measurement: "°C"
      device_class: temperature
      icon: mdi:thermometer

    - name: "Observatory Humidity"
      unique_id: observatory_bme280_humidity
      state_topic: "observatory/bme280/humidity"
      unit_of_measurement: "%"
      device_class: humidity
      icon: mdi:water-percent

    - name: "Observatory Pressure"
      unique_id: observatory_bme280_pressure
      state_topic: "observatory/bme280/pressure"
      unit_of_measurement: "hPa"
      device_class: pressure
      icon: mdi:gauge
