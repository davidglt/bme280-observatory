# BME280 Observatory — configuration example
# Copy to config.yaml and edit values

sensor:
  address: 0x76          # I2C address: 0x76 (SDO=GND) or 0x77 (SDO=VCC)
  interval_sec: 10       # Reading interval in seconds

mqtt:
  broker: "192.168.1.X"  # MQTT broker IP (e.g. Home Assistant host)
  port: 1883
  topic_prefix: "observatory/bme280"
  username: ""           # Leave empty if no auth
  password: ""

sharpcap:
  http_port: 5380        # Local HTTP port for SharpCap Custom HTTP Source
